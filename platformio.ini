; R9M transparent serial link
;
;   pio run -e master            module that owns the hop timing (UART)
;   pio run -e slave             module that follows it (UART)
;   pio run -e master_usb        same, serial over the STM32 USB port (HW mod)
;   pio run -e slave_usb
;   add  -t upload  to flash over ST-Link (bootloader + firmware)
;   pio test -e native           protocol unit tests on the host
;
; Settings: link_defines.txt (binding phrase, domain, overrides of link_config.h)

[platformio]
default_envs = master, slave

[r9m]
platform = ststm32@15.1.0
platform_packages =
	framework-arduinoststm32@https://github.com/stm32duino/Arduino_Core_STM32.git#2.1.0
	platformio/tool-stm32duino
framework = arduino
board = bluepill_f103c8
; first 16K hold the ELRS R9M bootloader
board_build.ldscript = variants/R9M_ldscript.ld
board_upload.maximum_size = 49152
upload_protocol = custom
extra_scripts =
	pre:scripts/link_defines.py
	scripts/upload.py
build_flags =
	-Wall
	-Iinclude
	-O2
	-flto
	-Wl,-Map,"'${BUILD_DIR}/firmware.map'"
	-D__FILE__='""'
	-Wno-builtin-macro-redefined
	-DPLATFORM_STM32=1
	-DHSE_VALUE=12000000U
	-DVECT_TAB_OFFSET=0x4000U
	-DRXBuffSize=128
	-DHWSERIAL_NONE
	-DSERIAL_RX_BUFFER_SIZE=256
	-DSERIAL_TX_BUFFER_SIZE=256

[env:master]
extends = r9m
build_flags = ${r9m.build_flags} -DLINK_ROLE_MASTER

[env:slave]
extends = r9m
build_flags = ${r9m.build_flags} -DLINK_ROLE_SLAVE

[usb]
; The USB identity (VID/PID and names) comes from scripts/link_defines.py,
; settable with LINK_USB_VID / LINK_USB_PID / LINK_USB_MANUFACTURER /
; LINK_USB_PRODUCT. It must not be the core's default 0483:5740, which
; QGroundControl lists as an "ArduPilot ChibiOS" flight controller.
build_flags =
	-DLINK_USB_SERIAL
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC

[env:master_usb]
extends = r9m
build_flags = ${r9m.build_flags} ${usb.build_flags} -DLINK_ROLE_MASTER

[env:slave_usb]
extends = r9m
build_flags = ${r9m.build_flags} ${usb.build_flags} -DLINK_ROLE_SLAVE

[env:native]
platform = native
build_flags = -std=c++11 -Wall -DUNIT_TEST
build_src_filter = -<*>
test_build_src = no
lib_ignore = DAC, FHSS, RFAMP, SPIEx, SX127xDriver, SX12xxDriverCommon
